name: tests

on:
  push:
    branches: ["master", "agent/**"]
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --frozen
      - name: Core accounting and French tax tests
        run: uv run python tests/test_core.py
      - name: PEA audit tests
        run: uv run python tests/test_pea.py
      - name: CLI smoke
        run: |
          uv run python -m bot.cli --help >/dev/null
          uv run python -m bot.cli backtest --help >/dev/null
