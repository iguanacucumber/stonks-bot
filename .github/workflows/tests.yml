name: tests

on:
  push:
    branches: ["master", "v*/**", "agent/**", "fix/**"]
  pull_request:
    branches: ["master"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen

      # Standalone scripts, no pytest dependency.  A glob keeps this complete
      # when a new test file lands; every script is run in its own process.
      - name: All test scripts (no network)
        run: |
          set -euo pipefail
          for f in tests/test_*.py; do
            echo "::group::$f"
            uv run python "$f"
            echo "::endgroup::"
          done

      # The real cache is 459 MB and is not committed.  The guard requires the
      # complete core set *and* the expected snapshot; one stray bar file must
      # never trigger a full baseline run.
      - name: Cache completeness guard
        id: cache
        run: |
          set -euo pipefail
          if uv run python scripts/acceptance.py --check-cache --json; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Acceptance smoke (cache-aware)
        run: |
          set -euo pipefail
          if [ "${{ steps.cache.outputs.full }}" = "true" ]; then
            uv run python scripts/acceptance.py --json
          else
            uv run python scripts/acceptance.py --allow-missing-cache --json
          fi

      # Full-cache reproduction is local evidence, not a CI requirement.
      - name: Full-cache reproduction
        if: steps.cache.outputs.full == 'true'
        run: |
          uv run python scripts/reproduce.py headline --paths 100 --no-strict
          uv run python scripts/reproduce.py audit

      - name: Cache-less reproduction skip
        if: steps.cache.outputs.full != 'true'
        run: echo "core cache incomplete or stale - full-cache reproduction skipped"

      - name: CLI smoke
        run: |
          uv run python -m bot.cli --help >/dev/null
          uv run python -m bot.cli backtest --help >/dev/null
          uv run python scripts/ops.py --help >/dev/null
          uv run python scripts/ops_drill.py >/dev/null
